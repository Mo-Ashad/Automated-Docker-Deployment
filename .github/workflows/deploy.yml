# ==============================================================================
# GitHub Actions: Automated Docker Deployment CI/CD Pipeline
# ==============================================================================
# This workflow automatically triggers on every push to the 'main' branch:
# Phase 1: Test - Runs unit tests to ensure code quality
# Phase 2: Build & Push - Builds Docker image and pushes it to registry
# Phase 3: Deploy - Deploys the latest container image
# ==============================================================================

name: Automated Docker CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

env:
  IMAGE_NAME: automated-docker-app

jobs:
  # ============================================================================
  # Stage 1: Continuous Integration (Automated Testing)
  # ============================================================================
  test:
    name: 🧪 Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Execute unit tests with Pytest
        run: |
          pytest -v test_app.py

  # ============================================================================
  # Stage 2: Container Build & Push
  # ============================================================================
  build-and-push:
    name: 🐳 Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: ⚙ Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      # Log in to GitHub Container Registry (GHCR) using default GitHub token
      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # (Optional) Log in to Docker Hub if secrets are configured
      - name: 🔑 Log in to Docker Hub (Optional)
        if: "${{ env.DOCKERHUB_USERNAME != '' }}"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷 Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 🚀 Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 3: Continuous Deployment
  # ============================================================================
  deploy:
    name: 🚀 Automated Deployment
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: 📋 Verify Deployment Workflow Execution
        run: |
          echo "=========================================================="
          echo "🎉 Docker image successfully built and pushed to registry!"
          echo "Registry Image: ghcr.io/${{ github.repository }}:latest"
          echo "Commit SHA: ${{ github.sha }}"
          echo "=========================================================="
          echo "To auto-pull and deploy to your server, run ./deploy.sh on the target host."
