# ===================================================================
# Docker Compose: Run the Automated Docker Deployment app locally
# ===================================================================

services:
  web:
    build: .
    image: automated-docker-app:latest
    container_name: automated_docker_app
    ports:
      - "5000:5000"
    environment:
      - APP_VERSION=1.0.0
      - APP_ENV=production
      - PORT=5000
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; port = os.getenv('PORT', '5000'); urllib.request.urlopen(f'http://localhost:{port}/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
